name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux security-key dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libudev-dev
      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup toolchain install 1.85.0 --profile minimal --component clippy
      - name: Install uv
        run: pipx install uv==0.7.2
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint stable Rust
        run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Lint minimum supported Rust
        run: cargo +1.85.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test default features
        run: cargo +stable test --locked --workspace
      - name: Test all features
        run: cargo +stable test --locked --workspace --all-features
      - name: Validate parity fixtures
        run: uv run --python 3.12 parity/python/validate_fixtures.py
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --workspace --all-features --no-deps
      - name: Build distributable crate archives
        run: cargo +stable package --locked --workspace --no-verify

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux security-key dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libudev-dev
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Configure Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"OPENSSL_DIR=$env:ProgramFiles\OpenSSL" >> $env:GITHUB_ENV'
      - name: Build all features
        run: cargo +stable build --locked --workspace --all-features
