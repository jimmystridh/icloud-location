[package]
name = "icloud-waze"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Optional Waze routing adapter for icloud-location"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
chrono = "0.4"
icloud-location-core = { version = "0.1.0", path = "../icloud-location-core" }
icloud-routing = { version = "0.1.0", path = "../icloud-routing" }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
