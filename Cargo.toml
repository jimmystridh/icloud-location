[package]
name = "icloud-location"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Standalone Rust client and CLI for locating Apple devices through iCloud Find My"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/icloud-location"
readme = "README.md"
keywords = ["apple", "icloud", "find-my", "location"]
categories = ["api-bindings", "command-line-utilities"]

[workspace]
members = [
    "crates/icloud-findmy",
    "crates/icloud-location-core",
    "crates/icloud-routing",
    "crates/icloud-tracking",
    "crates/icloud-waze",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Jimmy Stridh <jimmystridh@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/jimmystridh/icloud-location"
homepage = "https://github.com/jimmystridh/icloud-location"

[lib]
name = "icloud_location"
path = "src/lib.rs"

[[bin]]
name = "icloud-location"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6.0"
icloud-findmy = { version = "0.1.0", path = "crates/icloud-findmy" }
icloud-location-core = { version = "0.1.0", path = "crates/icloud-location-core" }
icloud-routing = { version = "0.1.0", path = "crates/icloud-routing" }
icloud-tracking = { version = "0.1.0", path = "crates/icloud-tracking" }
icloud-waze = { version = "0.1.0", path = "crates/icloud-waze", optional = true }
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"

[features]
default = []
security-key = ["icloud-findmy/security-key"]
waze = ["dep:icloud-waze"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
